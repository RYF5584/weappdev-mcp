name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # Zero runtime dependencies: nothing to install. `npm ci` would only be
      # needed if devDependencies appear later.
      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: CLI smoke test (no device)
        shell: bash
        run: |
          set -euo pipefail
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 30 node src/cli.mjs --no-usb --no-mdns --no-seed 2>/dev/null | head -1)
          echo "$out"
          echo "$out" | grep -q '"serverInfo"'
          echo "$out" | grep -q '"apiLevel"'

      - name: Package contents
        run: npm pack --dry-run

      - name: Validate server.json against package.json
        run: node scripts/validate-server-json.mjs
